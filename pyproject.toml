[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "production: requires the local detector/model runtime",
  "ui: Streamlit AppTest coverage",
]

[tool.ruff]
line-length = 140
target-version = "py311"
exclude = ["dataset", "outputs", "artifacts", ".venv", "src/batch.py", "src/pipeline.py", "src/types.py", "src/utils/logging.py", "src/detection/detector.py", "src/features/base.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "I001"]
